<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; -webkit-font-smoothing: antialiased; }
::selection { background: #f45a0b; color: #000; }
a { color: #f45a0b; text-decoration: none; }
.thf-wordmark { font-family: 'Russo One','Inter',system-ui,sans-serif; font-style: italic; }
@keyframes thf-orb { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-20px,20px); } }
input::placeholder { color: rgba(255,255,255,.3); }
input { color-scheme: dark; }
</style>
</helmet>

<div style="position: relative; min-height: 100vh; overflow: hidden; background: #080808; color: #f5f3ee; display: flex; align-items: center; justify-content: center; padding: 48px 20px; font-family: 'Inter', system-ui, sans-serif;">
  <div style="position: absolute; inset: 0; background-image: url('assets/p-velaria-sun.jpg'); background-size: cover; background-position: 50% 44%; filter: saturate(.9); opacity: .62; transform: scale(1.1);"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,8,8,.74), rgba(8,8,8,.6));"></div>
  <div style="position: absolute; width: 600px; height: 600px; border-radius: 50%; top: -15%; right: -15%; opacity: 0.45; background: radial-gradient(circle, #f26b1f 0%, transparent 70%); filter: blur(80px); animation: thf-orb 10s ease-in-out infinite; pointer-events: none;"></div>
  <div style="position: absolute; width: 500px; height: 500px; border-radius: 50%; bottom: -15%; left: -15%; opacity: 0.3; background: radial-gradient(circle, #ff7a2e 0%, transparent 70%); filter: blur(80px); animation: thf-orb 12s ease-in-out infinite 2s; pointer-events: none;"></div>

  <a href="./Tampico Hybrid Fest - Landing.dc.html" style="position: absolute; top: 24px; left: 20px; z-index: 20; font-size: 12px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,.6);">← Volver</a>

  <div style="position: relative; z-index: 10; width: 100%; max-width: 420px;">
    <a href="./Tampico Hybrid Fest - Landing.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 32px;">
      <span style="display: block; width: 26px; height: 26px; border: 3px solid #f45a0b; border-left-color: transparent; border-bottom-color: transparent; border-radius: 50%; transform: rotate(25deg) skewX(-8deg);"></span>
      <span style="font-weight: 700; font-size: 14px; letter-spacing: -0.02em;">TAMPICO <span style="color:#f45a0b;">HYBRID FEST</span></span>
    </a>

    <div style="position: relative; overflow: hidden; border-radius: 24px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.02); backdrop-filter: blur(16px); padding: 40px;">
      <div style="position: absolute; top: -1px; left: 48px; right: 48px; height: 1px; background: linear-gradient(90deg, transparent, #f45a0b, transparent);"></div>

      <div style="text-align: center; margin-bottom: 32px;">
        <p style="font-size: 11px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; color: #f45a0b; margin: 0 0 12px;">{{ modeLabel }}</p>
        <h1 class="thf-wordmark" style="font-size: clamp(1.8rem,4vw,2.2rem); text-transform: uppercase; line-height: 1.05; margin: 0;">{{ modeTitle }}</h1>
        <p style="font-size: 14px; color: rgba(255,255,255,.55); margin: 12px 0 0;">{{ modeSub }}</p>
      </div>

      <form onSubmit="{{ submit }}" style="display: grid; gap: 12px;">
        <div style="position: relative;">
          <span style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,.4);">✉</span>
          <input type="email" value="{{ email }}" onInput="{{ setEmail }}" placeholder="Email" required="" style="width: 100%; border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: rgba(0,0,0,.4); padding: 14px 16px 14px 44px; font-size: 14px; color: #fff; outline: none;" />
        </div>
        <div style="position: relative;">
          <span style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,.4);">🔒</span>
          <input type="{{ passwordType }}" value="{{ password }}" onInput="{{ setPassword }}" placeholder="Contraseña" required="" minlength="6" style="width: 100%; border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: rgba(0,0,0,.4); padding: 14px 44px 14px 44px; font-size: 14px; color: #fff; outline: none;" />
          <button type="button" onClick="{{ toggleShowPassword }}" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; color: rgba(255,255,255,.4); cursor: pointer;">{{ passwordToggleLabel }}</button>
        </div>
        <button type="submit" style="width: 100%; border-radius: 12px; background: #f45a0b; color: #000; padding: 16px; font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; border: none; cursor: pointer; margin-top: 8px;">{{ submitLabel }} →</button>
      </form>
    </div>

    <sc-if value="{{ notStaff }}" hint-placeholder-val="{{ true }}">
      <p style="text-align: center; font-size: 14px; color: rgba(255,255,255,.55); margin-top: 24px;">
        {{ switchPrompt }} <button type="button" onClick="{{ toggleMode }}" style="background: none; border: none; color: #f45a0b; font-weight: 600; cursor: pointer; padding: 0;">{{ switchAction }}</button>
      </p>
    </sc-if>

    <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.1); text-align: center;">
      <sc-if value="{{ notStaff }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ goStaff }}" style="display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: transparent; color: rgba(255,255,255,.7); padding: 10px 18px; font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;">🔑 Acceso staff &amp; admin</button>
      </sc-if>
      <sc-if value="{{ isStaff }}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{ goAthlete }}" style="display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: transparent; color: rgba(255,255,255,.7); padding: 10px 18px; font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;">← Volver al acceso de atletas</button>
      </sc-if>
    </div>

    <div style="margin-top: 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 16px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,.4);">
      <span>📅 14 — 15 Nov 2026</span>
      <span style="width: 1px; height: 12px; background: rgba(255,255,255,.15);"></span>
      <span>📍 La Velaria · Recinto Ferial Tampico</span>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mode: "login", email: "", password: "", showPassword: false };

  submit(e) {
    e.preventDefault();
    window.location.href = this.state.mode === "staff"
      ? "./Tampico Hybrid Fest - Admin.dc.html"
      : "./Tampico Hybrid Fest - Profile.dc.html";
  }

  renderVals() {
    const { mode, email, password, showPassword } = this.state;
    const isSignUp = mode === "signup";
    const isStaff = mode === "staff";
    return {
      isStaff, notStaff: !isStaff,
      goStaff: () => this.setState({ mode: "staff" }),
      goAthlete: () => this.setState({ mode: "login" }),
      modeLabel: isStaff ? "Acceso staff & admin" : isSignUp ? "Únete a la arena" : "Acceso atletas",
      modeTitle: isStaff ? "Panel del equipo THF." : isSignUp ? "Crea tu credencial." : "Bienvenido, atleta.",
      modeSub: isStaff
        ? "Entra con tu cuenta de staff para publicar workouts, patrocinadores y contenido del sitio."
        : isSignUp ? "Registra tu cuenta para asegurar tu lugar en THF 2026." : "Entra para ver tu credencial y categoría.",
      email, password,
      setEmail: (e) => this.setState({ email: e.target.value }),
      setPassword: (e) => this.setState({ password: e.target.value }),
      passwordType: showPassword ? "text" : "password",
      passwordToggleLabel: showPassword ? "🙈" : "👁",
      toggleShowPassword: () => this.setState({ showPassword: !showPassword }),
      submitLabel: isStaff ? "Entrar al panel" : isSignUp ? "Crear cuenta" : "Entrar",
      submit: (e) => this.submit(e),
      switchPrompt: isSignUp ? "¿Ya tienes cuenta?" : "¿Aún no estás registrado?",
      switchAction: isSignUp ? "Inicia sesión" : "Crea tu cuenta",
      toggleMode: () => this.setState({ mode: isSignUp ? "login" : "signup" }),
    };
  }
}
</script>
</body>
</html>
